; Web build: the scans are 8K, far more than a browser tab should download or hold. Cap world textures at 1K (the
; first uncapped build was 593 MB of content and ran over its texture pool).
[Wasm DeviceProfile]
+TextureLODGroups=(Group=TEXTUREGROUP_World,MaxLODSize=1024)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MaxLODSize=1024)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldSpecular,MaxLODSize=1024)
